name: opengarageflow
services:
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    container_name: opengarageflow-postgres
    restart: unless-stopped
    env_file:
      - ./postgres/.env
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - opengarageflow
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-opengarageflow}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: opengarageflow-api
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'
    networks:
      - opengarageflow

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: opengarageflow-web
    env_file:
      - ./apps/web/.env
    depends_on:
      api:
        condition: service_started
    ports:
      - '3000:3000'
    networks:
      - opengarageflow

volumes:
  postgres-data:

networks:
  opengarageflow:
    driver: bridge
